swagger: "2.0"
info:
  title: Helio Control API
  version: "0.1.0"
  description: |
    Contract-first machine API for project intake, brownfield baselines,
    agent pipelines, runs, evidence, and environments. Runtime event streams
    and HTML fragments have separate contracts in events.md and ui.md.
    Every project route enforces membership and the caller's project role. Agent
    credentials additionally require a task-scoped grant. Owner and Tech Lead
    may manage provider approvals and paid-token quotas. Swagger 2.0 documents
    these rules; the server must enforce them at runtime.
basePath: /api/v1
schemes: [http, https]
consumes: [application/json]
produces: [application/json]
securityDefinitions:
  OperatorToken:
    type: apiKey
    name: Authorization
    in: header
    description: "Bearer token; identity provider and session setup are deployment concerns."
security:
  - OperatorToken: []
parameters:
  projectId:
    name: projectId
    in: path
    required: true
    type: string
  interviewId:
    name: interviewId
    in: path
    required: true
    type: string
  specId:
    name: specId
    in: path
    required: true
    type: string
  baselineId:
    name: baselineId
    in: path
    required: true
    type: string
  pipelineId:
    name: pipelineId
    in: path
    required: true
    type: string
  runId:
    name: runId
    in: path
    required: true
    type: string
  environmentId:
    name: environmentId
    in: path
    required: true
    type: string
responses:
  BadRequest:
    description: Invalid input
    schema: { $ref: "#/definitions/Problem" }
  Conflict:
    description: Invalid state transition or concurrent change
    schema: { $ref: "#/definitions/Problem" }
  NotFound:
    description: Resource not found
    schema: { $ref: "#/definitions/Problem" }
  Unauthorized:
    description: Missing or invalid identity
    schema: { $ref: "#/definitions/Problem" }
  Forbidden:
    description: Authenticated identity lacks project or task permission
    schema: { $ref: "#/definitions/Problem" }
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      security: []
      responses:
        "200":
          description: Control plane is ready
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [ready] }
  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      responses:
        "200":
          description: Projects visible to the operator
          schema:
            type: array
            items: { $ref: "#/definitions/Project" }
        "401": { $ref: "#/responses/Unauthorized" }
    post:
      operationId: createProject
      tags: [Projects]
      description: Creates a project and assigns the caller the Project Owner role.
      parameters:
        - in: body
          name: project
          required: true
          schema: { $ref: "#/definitions/ProjectInput" }
      responses:
        "201":
          description: Created project
          schema: { $ref: "#/definitions/Project" }
        "400": { $ref: "#/responses/BadRequest" }
  /projects/{projectId}:
    parameters: [{ $ref: "#/parameters/projectId" }]
    get:
      operationId: getProject
      tags: [Projects]
      responses:
        "200":
          description: Project and current status
          schema: { $ref: "#/definitions/Project" }
        "404": { $ref: "#/responses/NotFound" }
        "403": { $ref: "#/responses/Forbidden" }
  /projects/{projectId}/memberships:
    parameters: [{ $ref: "#/parameters/projectId" }]
    get:
      operationId: listProjectMemberships
      tags: [Access]
      description: Project members may view active project roles.
      responses:
        "200":
          description: Project memberships
          schema:
            type: array
            items: { $ref: "#/definitions/ProjectMembership" }
        "403": { $ref: "#/responses/Forbidden" }
    post:
      operationId: assignProjectMembership
      tags: [Access]
      description: Only the Project Owner or Tech Lead may assign project roles.
      parameters:
        - in: body
          name: membership
          required: true
          schema: { $ref: "#/definitions/ProjectMembershipInput" }
      responses:
        "201":
          description: Assigned project role
          schema: { $ref: "#/definitions/ProjectMembership" }
        "403": { $ref: "#/responses/Forbidden" }
  /projects/{projectId}/provider-policies:
    parameters: [{ $ref: "#/parameters/projectId" }]
    get:
      operationId: listProviderPolicies
      tags: [Access]
      responses:
        "200":
          description: Project provider-policy revisions
          schema:
            type: array
            items: { $ref: "#/definitions/ProviderPolicy" }
        "403": { $ref: "#/responses/Forbidden" }
    post:
      operationId: approveProviderPolicy
      tags: [Access]
      description: Only the Project Owner or Tech Lead may approve a provider and its permitted data categories.
      parameters:
        - in: body
          name: policy
          required: true
          schema: { $ref: "#/definitions/ProviderPolicyInput" }
      responses:
        "201":
          description: Immutable provider-policy revision
          schema: { $ref: "#/definitions/ProviderPolicy" }
        "403": { $ref: "#/responses/Forbidden" }
  /projects/{projectId}/transfers:
    parameters: [{ $ref: "#/parameters/projectId" }]
    get:
      operationId: listTransferDecisions
      tags: [Access]
      description: Lists allow and deny decisions without transferred content or credentials.
      responses:
        "200":
          description: Project transfer audit
          schema:
            type: array
            items: { $ref: "#/definitions/TransferDecision" }
        "403": { $ref: "#/responses/Forbidden" }
  /projects/{projectId}/interviews:
    parameters: [{ $ref: "#/parameters/projectId" }]
    post:
      operationId: startInterview
      tags: [Intake]
      responses:
        "201":
          description: Interview started
          schema: { $ref: "#/definitions/Interview" }
        "404": { $ref: "#/responses/NotFound" }
  /projects/{projectId}/interviews/{interviewId}/answers:
    parameters:
      - { $ref: "#/parameters/projectId" }
      - { $ref: "#/parameters/interviewId" }
    post:
      operationId: recordInterviewAnswer
      tags: [Intake]
      parameters:
        - in: body
          name: answer
          required: true
          schema: { $ref: "#/definitions/InterviewAnswerInput" }
      responses:
        "201":
          description: Recorded answer
          schema: { $ref: "#/definitions/Interview" }
        "400": { $ref: "#/responses/BadRequest" }
        "409": { $ref: "#/responses/Conflict" }
  /projects/{projectId}/specifications:
    parameters: [{ $ref: "#/parameters/projectId" }]
    get:
      operationId: listSpecifications
      tags: [Planning]
      responses:
        "200":
          description: Specification revisions
          schema:
            type: array
            items: { $ref: "#/definitions/Specification" }
    post:
      operationId: createSpecification
      tags: [Planning]
      parameters:
        - in: body
          name: source
          required: true
          schema: { $ref: "#/definitions/SpecificationInput" }
      responses:
        "201":
          description: Draft specification
          schema: { $ref: "#/definitions/Specification" }
        "400": { $ref: "#/responses/BadRequest" }
  /projects/{projectId}/specifications/{specId}/approve:
    parameters:
      - { $ref: "#/parameters/projectId" }
      - { $ref: "#/parameters/specId" }
    post:
      operationId: approveSpecification
      tags: [Planning]
      description: Normal mode only; requires Project Owner or Tech Lead. Records an immutable acceptance decision.
      parameters:
        - in: body
          name: approval
          required: true
          schema: { $ref: "#/definitions/SpecificationApprovalInput" }
      responses:
        "200":
          description: Accepted or blocked immutable revision
          schema: { $ref: "#/definitions/Specification" }
        "403": { $ref: "#/responses/Forbidden" }
        "409": { $ref: "#/responses/Conflict" }
  /projects/{projectId}/specifications/{specId}/evaluate:
    parameters:
      - { $ref: "#/parameters/projectId" }
      - { $ref: "#/parameters/specId" }
    post:
      operationId: evaluateSpecification
      tags: [Planning]
      description: Autonomous or sandbox mode only. All required project checks must pass before automatic acceptance; failed or inconclusive results block a run.
      responses:
        "200":
          description: Recorded automatic acceptance result
          schema: { $ref: "#/definitions/Specification" }
        "403": { $ref: "#/responses/Forbidden" }
        "409": { $ref: "#/responses/Conflict" }
  /projects/{projectId}/roadmaps:
    parameters: [{ $ref: "#/parameters/projectId" }]
    post:
      operationId: generateRoadmaps
      tags: [Planning]
      parameters:
        - in: body
          name: inputs
          required: true
          schema: { $ref: "#/definitions/RoadmapInput" }
      responses:
        "202":
          description: Both roadmap jobs accepted
          schema:
            type: array
            items: { $ref: "#/definitions/Roadmap" }
        "400": { $ref: "#/responses/BadRequest" }
  /projects/{projectId}/baselines:
    parameters: [{ $ref: "#/parameters/projectId" }]
    post:
      operationId: startBaseline
      tags: [Brownfield]
      parameters:
        - in: body
          name: repositories
          required: true
          schema: { $ref: "#/definitions/BaselineInput" }
      responses:
        "202":
          description: Reconstruction started
          schema: { $ref: "#/definitions/Baseline" }
        "400": { $ref: "#/responses/BadRequest" }
  /projects/{projectId}/baselines/{baselineId}:
    parameters:
      - { $ref: "#/parameters/projectId" }
      - { $ref: "#/parameters/baselineId" }
    get:
      operationId: getBaseline
      tags: [Brownfield]
      responses:
        "200":
          description: Findings and source evidence
          schema: { $ref: "#/definitions/Baseline" }
        "404": { $ref: "#/responses/NotFound" }
  /projects/{projectId}/baselines/{baselineId}/evaluate:
    parameters:
      - { $ref: "#/parameters/projectId" }
      - { $ref: "#/parameters/baselineId" }
    post:
      operationId: evaluateBaseline
      tags: [Brownfield]
      description: Runs required checks. Accepts this version automatically only if all pass and no blocking gap remains.
      responses:
        "200":
          description: Accepted or blocked baseline with check evidence
          schema: { $ref: "#/definitions/Baseline" }
        "403": { $ref: "#/responses/Forbidden" }
        "409": { $ref: "#/responses/Conflict" }
  /agent-profiles:
    get:
      operationId: listAgentProfiles
      tags: [Agents]
      responses:
        "200":
          description: Published agent profiles
          schema:
            type: array
            items: { $ref: "#/definitions/AgentProfile" }
    post:
      operationId: createAgentProfile
      tags: [Agents]
      parameters:
        - in: body
          name: profile
          required: true
          schema: { $ref: "#/definitions/AgentProfileInput" }
      responses:
        "201":
          description: Draft profile
          schema: { $ref: "#/definitions/AgentProfile" }
  /pipelines:
    get:
      operationId: listPipelines
      tags: [Pipelines]
      responses:
        "200":
          description: Pipelines
          schema:
            type: array
            items: { $ref: "#/definitions/Pipeline" }
    post:
      operationId: createPipeline
      tags: [Pipelines]
      parameters:
        - in: body
          name: pipeline
          required: true
          schema: { $ref: "#/definitions/PipelineInput" }
      responses:
        "201":
          description: Draft pipeline
          schema: { $ref: "#/definitions/Pipeline" }
        "400": { $ref: "#/responses/BadRequest" }
  /pipelines/{pipelineId}/publish:
    parameters: [{ $ref: "#/parameters/pipelineId" }]
    post:
      operationId: publishPipeline
      tags: [Pipelines]
      responses:
        "200":
          description: Published immutable pipeline version
          schema: { $ref: "#/definitions/Pipeline" }
        "409": { $ref: "#/responses/Conflict" }
  /projects/{projectId}/runs:
    parameters: [{ $ref: "#/parameters/projectId" }]
    get:
      operationId: listRuns
      tags: [Runs]
      responses:
        "200":
          description: Project runs
          schema:
            type: array
            items: { $ref: "#/definitions/Run" }
    post:
      operationId: startRun
      tags: [Runs]
      description: Requires a project run permission and an accepted specification revision; brownfield runs also require an accepted baseline version. Normal mode requires human acceptance, while autonomous or sandbox mode may use passing automatic checks.
      parameters:
        - in: body
          name: run
          required: true
          schema: { $ref: "#/definitions/RunInput" }
      responses:
        "202":
          description: Queued run
          schema: { $ref: "#/definitions/Run" }
        "400": { $ref: "#/responses/BadRequest" }
        "403": { $ref: "#/responses/Forbidden" }
        "409": { $ref: "#/responses/Conflict" }
  /projects/{projectId}/runs/{runId}:
    parameters:
      - { $ref: "#/parameters/projectId" }
      - { $ref: "#/parameters/runId" }
    get:
      operationId: getRun
      tags: [Runs]
      responses:
        "200":
          description: Run state and usage
          schema: { $ref: "#/definitions/Run" }
        "404": { $ref: "#/responses/NotFound" }
  /projects/{projectId}/runs/{runId}/control:
    parameters:
      - { $ref: "#/parameters/projectId" }
      - { $ref: "#/parameters/runId" }
    post:
      operationId: controlRun
      tags: [Runs]
      description: Pause or cancel a run, or resume an operator-paused run. A quota-pending run resumes only after an authorized quota increase.
      parameters:
        - in: body
          name: action
          required: true
          schema: { $ref: "#/definitions/RunControl" }
      responses:
        "200":
          description: Updated run state
          schema: { $ref: "#/definitions/Run" }
        "409": { $ref: "#/responses/Conflict" }
        "403": { $ref: "#/responses/Forbidden" }
  /projects/{projectId}/runs/{runId}/quota:
    parameters:
      - { $ref: "#/parameters/projectId" }
      - { $ref: "#/parameters/runId" }
    post:
      operationId: raiseRunPaidTokenQuota
      tags: [Runs]
      description: Project Owner or Tech Lead raises the paid-token quota. A quota-pending run resumes the same session and skips completed stages after the checkpoint is validated.
      parameters:
        - in: body
          name: quota
          required: true
          schema: { $ref: "#/definitions/QuotaIncreaseInput" }
      responses:
        "200":
          description: Updated run with append-only quota change
          schema: { $ref: "#/definitions/Run" }
        "403": { $ref: "#/responses/Forbidden" }
        "409": { $ref: "#/responses/Conflict" }
  /projects/{projectId}/comparisons:
    parameters: [{ $ref: "#/parameters/projectId" }]
    post:
      operationId: compareRuns
      tags: [Runs]
      parameters:
        - in: body
          name: runs
          required: true
          schema: { $ref: "#/definitions/ComparisonInput" }
      responses:
        "200":
          description: Comparable outcomes and usage
          schema: { $ref: "#/definitions/Comparison" }
        "400": { $ref: "#/responses/BadRequest" }
  /projects/{projectId}/environments:
    parameters: [{ $ref: "#/parameters/projectId" }]
    get:
      operationId: listEnvironments
      tags: [Environments]
      responses:
        "200":
          description: Environment definitions
          schema:
            type: array
            items: { $ref: "#/definitions/Environment" }
    post:
      operationId: defineEnvironment
      tags: [Environments]
      parameters:
        - in: body
          name: environment
          required: true
          schema: { $ref: "#/definitions/EnvironmentInput" }
      responses:
        "201":
          description: Environment revision
          schema: { $ref: "#/definitions/Environment" }
  /projects/{projectId}/environments/{environmentId}/validate:
    parameters:
      - { $ref: "#/parameters/projectId" }
      - { $ref: "#/parameters/environmentId" }
    post:
      operationId: validateEnvironment
      tags: [Environments]
      responses:
        "200":
          description: Prerequisite and configuration checks
          schema:
            type: array
            items: { $ref: "#/definitions/EnvironmentCheck" }
  /projects/{projectId}/environments/{environmentId}/deployments:
    parameters:
      - { $ref: "#/parameters/projectId" }
      - { $ref: "#/parameters/environmentId" }
    post:
      operationId: proposeDeployment
      tags: [Environments]
      parameters:
        - in: body
          name: deployment
          required: true
          schema: { $ref: "#/definitions/DeploymentInput" }
      responses:
        "201":
          description: Proposal with validation and change-set references
          schema: { $ref: "#/definitions/DeploymentRecord" }
        "409": { $ref: "#/responses/Conflict" }
  /projects/{projectId}/runs/{runId}/prototype:
    parameters:
      - { $ref: "#/parameters/projectId" }
      - { $ref: "#/parameters/runId" }
    get:
      operationId: getRunPrototype
      tags: [Prototypes]
      responses:
        "200":
          description: Prototype and mock references
          schema: { $ref: "#/definitions/Prototype" }
        "404": { $ref: "#/responses/NotFound" }
  /projects/{projectId}/runs/{runId}/review-environment:
    parameters:
      - { $ref: "#/parameters/projectId" }
      - { $ref: "#/parameters/runId" }
    post:
      operationId: startReviewEnvironment
      tags: [Prototypes]
      responses:
        "202":
          description: Isolated review stack starting
          schema: { $ref: "#/definitions/ReviewEnvironment" }
        "409": { $ref: "#/responses/Conflict" }
  /projects/{projectId}/decisions:
    parameters: [{ $ref: "#/parameters/projectId" }]
    post:
      operationId: recordDecision
      tags: [Knowledge]
      parameters:
        - in: body
          name: decision
          required: true
          schema: { $ref: "#/definitions/DecisionInput" }
      responses:
        "201":
          description: Recorded decision
          schema: { $ref: "#/definitions/DecisionRecord" }
  /projects/{projectId}/tasks:
    parameters: [{ $ref: "#/parameters/projectId" }]
    get:
      operationId: listTasks
      tags: [Tasks]
      responses:
        "200":
          description: Project tasks
          schema:
            type: array
            items: { $ref: "#/definitions/TaskRecord" }
    post:
      operationId: recordTask
      tags: [Tasks]
      parameters:
        - in: body
          name: task
          required: true
          schema: { $ref: "#/definitions/TaskInput" }
      responses:
        "201":
          description: Task with stable project link
          schema: { $ref: "#/definitions/TaskRecord" }
  /projects/{projectId}/tasks/{taskId}/exports:
    parameters:
      - { $ref: "#/parameters/projectId" }
      - name: taskId
        in: path
        required: true
        type: string
    post:
      operationId: exportTask
      tags: [Tasks]
      parameters:
        - in: body
          name: export
          required: true
          schema: { $ref: "#/definitions/TaskExportInput" }
      responses:
        "202":
          description: Export requested
          schema: { $ref: "#/definitions/TaskRecord" }
        "409": { $ref: "#/responses/Conflict" }
  /projects/{projectId}/knowledge:
    parameters: [{ $ref: "#/parameters/projectId" }]
    get:
      operationId: listKnowledge
      tags: [Knowledge]
      parameters:
        - name: query
          in: query
          type: string
      responses:
        "200":
          description: Source-backed project knowledge
          schema:
            type: array
            items: { $ref: "#/definitions/KnowledgeEntry" }
    post:
      operationId: recordKnowledge
      tags: [Knowledge]
      parameters:
        - in: body
          name: entry
          required: true
          schema: { $ref: "#/definitions/KnowledgeInput" }
      responses:
        "201":
          description: Recorded entry
          schema: { $ref: "#/definitions/KnowledgeEntry" }
definitions:
  Problem:
    type: object
    required: [code, message]
    properties:
      code: { type: string }
      message: { type: string }
      details: { type: object, additionalProperties: true }
  ProjectInput:
    type: object
    required: [name, kind]
    properties:
      name: { type: string, minLength: 1 }
      kind: { type: string, enum: [greenfield, brownfield] }
      description: { type: string }
  Project:
    allOf:
      - { $ref: "#/definitions/ProjectInput" }
      - type: object
        required: [id, status, owner_id, provider_policy_revision]
        properties:
          id: { type: string }
          status: { type: string, enum: [draft, defined, active, archived] }
          owner_id: { type: string }
          provider_policy_revision: { type: integer, minimum: 0 }
  ProjectMembershipInput:
    type: object
    required: [person_id, role]
    properties:
      person_id: { type: string }
      role: { type: string, enum: [owner, tech_lead, runner, viewer] }
  ProjectMembership:
    allOf:
      - { $ref: "#/definitions/ProjectMembershipInput" }
      - type: object
        required: [id, project_id, active_from]
        properties:
          id: { type: string }
          project_id: { type: string }
          active_from: { type: string, format: date-time }
          active_to: { type: string, format: date-time }
  ProviderPolicyInput:
    type: object
    required: [provider_id, permitted_data_categories, status]
    properties:
      provider_id: { type: string }
      permitted_data_categories:
        type: array
        items: { type: string }
      status: { type: string, enum: [approved, revoked] }
      rationale: { type: string }
  ProviderPolicy:
    allOf:
      - { $ref: "#/definitions/ProviderPolicyInput" }
      - type: object
        required: [id, project_id, revision, approved_by, approved_at]
        properties:
          id: { type: string }
          project_id: { type: string }
          revision: { type: integer, minimum: 1 }
          approved_by: { type: string }
          approved_at: { type: string, format: date-time }
  TransferDecision:
    type: object
    required: [id, project_id, provider_id, purpose, data_categories, policy_revision, decision, reason, occurred_at]
    properties:
      id: { type: string }
      project_id: { type: string }
      run_id: { type: string }
      stage_id: { type: string }
      provider_id: { type: string }
      purpose: { type: string }
      data_categories:
        type: array
        items: { type: string }
      policy_revision: { type: integer, minimum: 0 }
      decision: { type: string, enum: [allowed, denied] }
      reason: { type: string }
      occurred_at: { type: string, format: date-time }
      request_id: { type: string }
  InterviewAnswerInput:
    type: object
    required: [question_key, answer]
    properties:
      question_key: { type: string }
      answer: { type: string }
      source: { type: string }
  Interview:
    type: object
    required: [id, project_id, status, unresolved_questions]
    properties:
      id: { type: string }
      project_id: { type: string }
      status: { type: string, enum: [open, ready_for_review, closed] }
      unresolved_questions:
        type: array
        items: { type: string }
  SpecificationInput:
    type: object
    required: [source_interview_id, acceptance_mode]
    properties:
      source_interview_id: { type: string }
      source_baseline_id: { type: string }
      acceptance_mode: { type: string, enum: [normal, autonomous, sandbox] }
  Specification:
    type: object
    required: [id, project_id, revision, status, acceptance_mode]
    properties:
      id: { type: string }
      project_id: { type: string }
      revision: { type: integer, minimum: 1 }
      status: { type: string, enum: [draft, review_required, evaluating, accepted, blocked, superseded] }
      acceptance_mode: { type: string, enum: [normal, autonomous, sandbox] }
      acceptance_decision: { $ref: "#/definitions/AcceptanceDecision" }
      requirement_count: { type: integer, minimum: 0 }
      acceptance_count: { type: integer, minimum: 0 }
  SpecificationApprovalInput:
    type: object
    required: [decision, rationale]
    properties:
      decision: { type: string, enum: [approve, reject] }
      rationale: { type: string }
  AcceptanceDecision:
    type: object
    required: [id, subject_type, subject_id, subject_revision, mode, kind, result, decided_at]
    properties:
      id: { type: string }
      subject_type: { type: string, enum: [specification, baseline] }
      subject_id: { type: string }
      subject_revision: { type: integer, minimum: 1 }
      mode: { type: string, enum: [normal, autonomous, sandbox, brownfield] }
      kind: { type: string, enum: [manual, automatic] }
      result: { type: string, enum: [accepted, blocked] }
      actor_id: { type: string }
      required_check_refs: { type: array, items: { type: string } }
      evidence_refs: { type: array, items: { type: string } }
      decided_at: { type: string, format: date-time }
  CheckResult:
    type: object
    required: [check_id, result, checked_at]
    properties:
      check_id: { type: string }
      result: { type: string, enum: [passed, failed, inconclusive] }
